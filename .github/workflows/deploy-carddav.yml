name: Deploy CardDAV to Cloudflare

on:
  push:
    branches: ["master"]
    paths:
      - "data/**"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-carddav.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carddav-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 git 历史，构建时用提交时间作为 REV
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static CardDAV data
        run: bun run build:carddav

      # 不再在 CI 里写 CARDDAV_PASS secret：
      # wrangler secret put 会额外触发一次异步的 "Secret Change" 部署，
      # 它用旧脚本覆盖紧随其后的 deploy，导致线上一直跑旧代码。
      # CardDAV / 管理员密码统一在 Cloudflare Workers 控制台手动维护。
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed Worker
        run: |
          echo "--- wrangler deployments ---"
          npx wrangler deployments list || true
          echo "--- live check ---"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/live-admin.html -w "%{http_code}" -m 20 -u "${ADMIN_USER}:${ADMIN_PASS}" https://card.585119.xyz/admin || true)
            size=$(wc -c < /tmp/live-admin.html 2>/dev/null || echo 0)
            hits=$(grep -c "同步日志" /tmp/live-admin.html 2>/dev/null || true)
            echo "try$i http=$code size=$size syncLogHits=$hits"
            if [ "$hits" -gt 0 ]; then break; fi
            sleep 5
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

      - name: Upload data to R2
        run: bash scripts/upload-carddav.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'vcards-carddav' }}

      - name: Summary
        run: |
          echo "### CardDAV 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 联系人数量: $(node -e "const c=require('./dist/carddav/catalog.json');console.log(c.books.reduce((n,b)=>n+b.contacts.length,0))")" >> $GITHUB_STEP_SUMMARY
          echo "- 分类数量: $(node -e "const c=require('./dist/carddav/catalog.json');console.log(c.books.length)")" >> $GITHUB_STEP_SUMMARY
          echo "- 构建时间: $(node -e "console.log(require('./dist/carddav/catalog.json').generatedAt)")" >> $GITHUB_STEP_SUMMARY
