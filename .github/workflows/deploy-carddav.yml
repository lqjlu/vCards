name: Deploy CardDAV to Cloudflare

on:
  push:
    branches: ["master"]
    paths:
      - "data/**"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-carddav.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carddav-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 git 历史，构建时用提交时间作为 REV
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static CardDAV data
        run: bun run build:carddav

      - name: Set CardDAV password secret
        run: |
          if [ -n "$CARDDAV_PASS" ]; then
            printf '%s' "$CARDDAV_PASS" | npx wrangler secret put CARDDAV_PASS
          else
            echo "CARDDAV_PASS secret not set; skip"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CARDDAV_PASS: ${{ secrets.CARDDAV_PASS }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload data to R2
        run: bash scripts/upload-carddav.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'vcards-carddav' }}

      - name: Summary
        run: |
          echo "### CardDAV 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 联系人数量: $(node -e "const c=require('./dist/carddav/catalog.json');console.log(c.books.reduce((n,b)=>n+b.contacts.length,0))")" >> $GITHUB_STEP_SUMMARY
          echo "- 分类数量: $(node -e "const c=require('./dist/carddav/catalog.json');console.log(c.books.length)")" >> $GITHUB_STEP_SUMMARY
          echo "- 构建时间: $(node -e "console.log(require('./dist/carddav/catalog.json').generatedAt)")" >> $GITHUB_STEP_SUMMARY
