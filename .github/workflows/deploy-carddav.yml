name: Deploy CardDAV to Cloudflare

on:
  push:
    branches: ["master"]
    paths:
      - "data/**"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-carddav.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carddav-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 git 历史，构建时用提交时间作为 REV
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static CardDAV data
        run: bun run build:carddav

      # 后台管理页登录凭据，来自 GitHub Actions Secrets (ADMIN_USER / ADMIN_PASS)。
      - name: Configure admin credentials
        run: |
          printf '%s' "$ADMIN_USER" | npx wrangler secret put ADMIN_USER
          printf '%s' "$ADMIN_PASS" | npx wrangler secret put ADMIN_PASS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/deploy-out.txt
          VERSION=$(grep -oE 'Current Version ID: [a-f0-9-]+' /tmp/deploy-out.txt | awk '{print $4}' | tail -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deployed version: $VERSION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure domain route points to this Worker
        run: |
          ZONE=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=585119.xyz" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or [{}])[0].get('id',''))")
          echo "zone=$ZONE"
          ROUTES=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes")
          echo "$ROUTES" | python3 -c "import sys,json; d=json.load(sys.stdin); [print('route:',r.get('pattern'),'->',r.get('script')) for r in (d.get('result') or [])]"
          STALE=$(echo "$ROUTES" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(r.get('id','') for r in (d.get('result') or []) if r.get('pattern','').startswith('card.585119.xyz') and r.get('script')!='vcards-carddav'))")
          for id in $STALE; do
            echo "Repointing route $id -> vcards-carddav"
            curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"pattern":"card.585119.xyz/*","script":"vcards-carddav"}' \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$id"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live service
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -u "${ADMIN_USER}:${ADMIN_PASS}" https://card.585119.xyz/admin/api/logs || true)
            echo "try$i logs api http=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

      - name: Upload data to R2
        run: bash scripts/upload-carddav.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'vcards-carddav' }}

      - name: Summary
        run: |
          echo "### CardDAV 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 联系人数量: $(node -e "const c=require('./dist/carddav/catalog.json');console.log(c.books.reduce((n,b)=>n+b.contacts.length,0))")" >> $GITHUB_STEP_SUMMARY
          echo "- 分类数量: $(node -e "const c=require('./dist/carddav/catalog.json').books.length")" >> $GITHUB_STEP_SUMMARY
          echo "- 构建时间: $(node -e "console.log(require('./dist/carddav/catalog.json').generatedAt)")" >> $GITHUB_STEP_SUMMARY
